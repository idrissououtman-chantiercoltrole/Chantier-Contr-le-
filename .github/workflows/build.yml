name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Fabriquer l'APK
        run:  gradle :application:assembleDebug --stacktrace

      - name: Deposer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Chantier-Controle-APK
          path: application/build/outputs/apk/debug
